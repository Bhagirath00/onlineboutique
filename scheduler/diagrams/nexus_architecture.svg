<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a1a3e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="k8sGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#326ce5;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2457b5;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="nexusGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e3f;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#12122a;stop-opacity:0.95"/>
    </linearGradient>
    <linearGradient id="spikeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#c23152;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="depGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#0a2848;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="gangGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#533483;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#3f2566;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="extGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a6b3c;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#125a2e;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="dormGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a4a2e;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#3a3a20;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="metGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d6a8f;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#1f5070;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="promGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e6522c;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c4431f;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowWhite" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#aaa"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e94560"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4ade80"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb923c"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" fill="#fff" font-size="22" font-weight="700" filter="url(#glow)">NEXUS Scheduler — Research-Faithful Architecture</text>
  <text x="600" y="62" text-anchor="middle" fill="#888" font-size="12">Event-Driven Dependency-Aware Scheduler Extender for Kubernetes</text>

  <!-- ═══ Kubernetes Control Plane (Top Right) ═══ -->
  <rect x="820" y="85" width="360" height="155" rx="12" fill="url(#k8sGrad)" stroke="#5b8def" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1000" y="110" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Kubernetes Control Plane</text>

  <!-- kube-scheduler -->
  <rect x="840" y="125" width="155" height="55" rx="8" fill="#1e3a6e" stroke="#5b8def" stroke-width="1"/>
  <text x="917" y="149" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">kube-scheduler</text>
  <text x="917" y="168" text-anchor="middle" fill="#93c5fd" font-size="10">(Default — Always Binds)</text>

  <!-- kube-apiserver -->
  <rect x="1010" y="125" width="155" height="55" rx="8" fill="#1e3a6e" stroke="#5b8def" stroke-width="1"/>
  <text x="1087" y="149" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">kube-apiserver</text>
  <text x="1087" y="168" text-anchor="middle" fill="#93c5fd" font-size="10">(Pod &amp; Node Data)</text>

  <!-- ═══ Prometheus (Top Left) ═══ -->
  <rect x="20" y="105" width="180" height="70" rx="10" fill="url(#promGrad)" stroke="#ff7e5f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="110" y="135" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Prometheus</text>
  <text x="110" y="155" text-anchor="middle" fill="#ffd5c5" font-size="10">monitoring namespace</text>

  <!-- ═══ NEXUS System (Large Box) ═══ -->
  <rect x="20" y="260" width="1160" height="610" rx="14" fill="url(#nexusGrad)" stroke="#533483" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="290" text-anchor="middle" fill="#e94560" font-size="16" font-weight="700">NEXUS Scheduler Extender</text>
  <text x="600" y="308" text-anchor="middle" fill="#777" font-size="11">nexus-system namespace  •  Cooperative (Never Binds Pods)</text>

  <!-- ═══ Phase 1: Spike Detector ═══ -->
  <rect x="40" y="325" width="220" height="140" rx="10" fill="url(#spikeGrad)" stroke="#e94560" stroke-width="1.2"/>
  <text x="150" y="350" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">Phase 1: Spike Detector</text>
  <line x1="60" y1="358" x2="240" y2="358" stroke="#e9456066" stroke-width="1"/>
  <text x="150" y="378" text-anchor="middle" fill="#ffccd5" font-size="10">spike.go</text>
  <text x="150" y="398" text-anchor="middle" fill="#eee" font-size="10">• RPS Threshold</text>
  <text x="150" y="414" text-anchor="middle" fill="#eee" font-size="10">• Error Rate (5xx)</text>
  <text x="150" y="430" text-anchor="middle" fill="#eee" font-size="10">• HPA Scale Events</text>
  <text x="150" y="446" text-anchor="middle" fill="#eee" font-size="10">• p95 Latency</text>

  <!-- ═══ Phase 2: Dependency Engine ═══ -->
  <rect x="280" y="325" width="230" height="140" rx="10" fill="url(#depGrad)" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="395" y="350" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">Phase 2: Dependency Engine</text>
  <line x1="300" y1="358" x2="490" y2="358" stroke="#60a5fa66" stroke-width="1"/>
  <text x="395" y="378" text-anchor="middle" fill="#bfdbfe" font-size="10">dependency.go</text>
  <text x="395" y="398" text-anchor="middle" fill="#eee" font-size="10">• Parses nexus.io/depends-on</text>
  <text x="395" y="414" text-anchor="middle" fill="#eee" font-size="10">• Builds In-Memory DAG</text>
  <text x="395" y="430" text-anchor="middle" fill="#eee" font-size="10">• Identifies Critical Path</text>
  <text x="395" y="446" text-anchor="middle" fill="#fbbf24" font-size="10">Runtime Only (No Static YAML)</text>

  <!-- ═══ Phase 3: Gang Manager ═══ -->
  <rect x="530" y="325" width="220" height="140" rx="10" fill="url(#gangGrad)" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="640" y="350" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">Phase 3: Gang Manager</text>
  <line x1="550" y1="358" x2="730" y2="358" stroke="#a78bfa66" stroke-width="1"/>
  <text x="640" y="378" text-anchor="middle" fill="#ddd6fe" font-size="10">gang.go (NEW)</text>
  <text x="640" y="398" text-anchor="middle" fill="#eee" font-size="10">• Forms Temporary Gangs</text>
  <text x="640" y="414" text-anchor="middle" fill="#eee" font-size="10">• Assigns Gang Labels</text>
  <text x="640" y="430" text-anchor="middle" fill="#eee" font-size="10">• Dissolves on Cooldown</text>
  <text x="640" y="446" text-anchor="middle" fill="#fbbf24" font-size="10">Ephemeral Lifecycle</text>

  <!-- ═══ Phase 5: Dormancy Controller ═══ -->
  <rect x="770" y="325" width="200" height="140" rx="10" fill="url(#dormGrad)" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="870" y="350" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">Phase 5: Dormancy</text>
  <line x1="790" y1="358" x2="950" y2="358" stroke="#fbbf2466" stroke-width="1"/>
  <text x="870" y="378" text-anchor="middle" fill="#fef3c7" font-size="10">main.go</text>
  <text x="870" y="398" text-anchor="middle" fill="#eee" font-size="10">• IDLE → No Opinion</text>
  <text x="870" y="414" text-anchor="middle" fill="#eee" font-size="10">• ACTIVE → Extender On</text>
  <text x="870" y="430" text-anchor="middle" fill="#eee" font-size="10">• Cooldown Timer (30s)</text>
  <text x="870" y="446" text-anchor="middle" fill="#4ade80" font-size="10">Near-Zero Idle Overhead</text>

  <!-- ═══ Research Metrics ═══ -->
  <rect x="990" y="325" width="175" height="140" rx="10" fill="url(#metGrad)" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="1077" y="350" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">Research Metrics</text>
  <line x1="1010" y1="358" x2="1145" y2="358" stroke="#38bdf866" stroke-width="1"/>
  <text x="1077" y="378" text-anchor="middle" fill="#bae6fd" font-size="10">metrics.go (NEW)</text>
  <text x="1077" y="398" text-anchor="middle" fill="#eee" font-size="9">activation_latency_ms</text>
  <text x="1077" y="414" text-anchor="middle" fill="#eee" font-size="9">gang_formation_ms</text>
  <text x="1077" y="430" text-anchor="middle" fill="#eee" font-size="9">filter_overhead_ms</text>
  <text x="1077" y="446" text-anchor="middle" fill="#eee" font-size="9">prioritize_overhead_ms</text>

  <!-- ═══ Phase 4: Scheduler Extender (Bottom) ═══ -->
  <rect x="130" y="510" width="940" height="170" rx="12" fill="url(#extGrad)" stroke="#4ade80" stroke-width="1.5"/>
  <text x="600" y="540" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">Phase 4: Scheduler Extender HTTP API</text>
  <text x="600" y="558" text-anchor="middle" fill="#86efac" font-size="10">main.go — Cooperative Integration with kube-scheduler</text>

  <!-- /filter endpoint -->
  <rect x="180" y="575" width="380" height="90" rx="8" fill="#0f4a25" stroke="#4ade80" stroke-width="1"/>
  <text x="370" y="600" text-anchor="middle" fill="#4ade80" font-size="13" font-weight="700">POST /filter</text>
  <text x="370" y="620" text-anchor="middle" fill="#d1fae5" font-size="10">Receives: ExtenderArgs (Pod + NodeList)</text>
  <text x="370" y="636" text-anchor="middle" fill="#d1fae5" font-size="10">IDLE → Returns all nodes (no opinion)</text>
  <text x="370" y="652" text-anchor="middle" fill="#fbbf24" font-size="10">ACTIVE → Removes nodes without gang members</text>

  <!-- /prioritize endpoint -->
  <rect x="610" y="575" width="410" height="90" rx="8" fill="#0f4a25" stroke="#4ade80" stroke-width="1"/>
  <text x="815" y="600" text-anchor="middle" fill="#4ade80" font-size="13" font-weight="700">POST /prioritize</text>
  <text x="815" y="620" text-anchor="middle" fill="#d1fae5" font-size="10">Receives: ExtenderArgs (Pod + NodeList)</text>
  <text x="815" y="636" text-anchor="middle" fill="#d1fae5" font-size="10">IDLE → Returns equal scores (no opinion)</text>
  <text x="815" y="652" text-anchor="middle" fill="#fbbf24" font-size="10">ACTIVE → Scores by gang locality</text>

  <!-- ═══ DATA FLOW ARROWS ═══ -->

  <!-- Prometheus → Spike Detector -->
  <line x1="110" y1="175" x2="110" y2="325" stroke="#e94560" stroke-width="2" marker-end="url(#arrowRed)" stroke-dasharray="6,3"/>
  <text x="95" y="250" fill="#e94560" font-size="9" transform="rotate(-90, 95, 250)">QPS / Errors / HPA / p95</text>

  <!-- Spike Detector → Dormancy (SPIKE_EVENT) -->
  <line x1="260" y1="395" x2="770" y2="395" stroke="#e94560" stroke-width="1.8" marker-end="url(#arrowRed)" stroke-dasharray="5,3"/>
  <rect x="420" y="381" width="100" height="16" rx="4" fill="#1a1a2e"/>
  <text x="470" y="393" text-anchor="middle" fill="#e94560" font-size="9" font-weight="600">SPIKE_EVENT</text>

  <!-- Dormancy → Dependency Engine (Activate) -->
  <path d="M 870 465 L 870 488 L 395 488 L 395 465" fill="none" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrowBlue)" stroke-dasharray="5,3"/>
  <text x="633" y="484" text-anchor="middle" fill="#60a5fa" font-size="9">Activate: Build Graph</text>

  <!-- Dependency Engine → Gang Manager (DAG) -->
  <line x1="510" y1="370" x2="530" y2="370" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <text x="520" y="364" text-anchor="middle" fill="#a78bfa" font-size="8">DAG</text>

  <!-- Gang Manager → /filter -->
  <line x1="640" y1="465" x2="450" y2="575" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="520" y="515" fill="#4ade80" font-size="9">Gang Data</text>

  <!-- Gang Manager → /prioritize -->
  <line x1="680" y1="465" x2="780" y2="575" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="750" y="515" fill="#4ade80" font-size="9">Gang Data</text>

  <!-- kube-scheduler → /filter -->
  <path d="M 917 180 L 917 220 L 370 220 L 370 510" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <rect x="540" y="212" width="130" height="16" rx="4" fill="#0a0a1a"/>
  <text x="605" y="224" text-anchor="middle" fill="#4ade80" font-size="9" font-weight="600">1. Filter Request</text>

  <!-- kube-scheduler → /prioritize -->
  <path d="M 950 180 L 950 242 L 815 242 L 815 510" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <rect x="831" y="234" width="130" height="16" rx="4" fill="#0a0a1a"/>
  <text x="896" y="246" text-anchor="middle" fill="#4ade80" font-size="9" font-weight="600">2. Prioritize Request</text>

  <!-- kube-scheduler → apiserver (Bind) -->
  <line x1="995" y1="152" x2="1010" y2="152" stroke="#5b8def" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="1003" y="146" text-anchor="middle" fill="#93c5fd" font-size="8">3. Bind</text>

  <!-- Metrics → Prometheus -->
  <path d="M 1077 325 L 1077 200 L 200 200 L 200 160" fill="none" stroke="#fb923c" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrowOrange)"/>
  <text x="640" y="195" text-anchor="middle" fill="#fb923c" font-size="9">Scraped by Prometheus</text>

  <!-- Dormancy → Gang Manager (Cooldown/Dissolve) -->
  <line x1="870" y1="465" x2="700" y2="465" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrowOrange)"/>
  <text x="785" y="478" text-anchor="middle" fill="#fbbf24" font-size="8">Dissolve Gang</text>

  <!-- ═══ KEY PRINCIPLE BOX ═══ -->
  <rect x="40" y="725" width="1120" height="70" rx="10" fill="#0a0a1a" stroke="#e9456088" stroke-width="1.5"/>
  <text x="600" y="750" text-anchor="middle" fill="#e94560" font-size="14" font-weight="700">⚡ KEY ARCHITECTURAL PRINCIPLE</text>
  <text x="600" y="772" text-anchor="middle" fill="#ccc" font-size="11">kube-scheduler is ALWAYS the decision maker  •  NEXUS only ADVISES via Filter + Prioritize  •  NEXUS NEVER binds pods  •  NEXUS NEVER migrates pods</text>
  <text x="600" y="788" text-anchor="middle" fill="#888" font-size="10">NEXUS is DORMANT unless spike detected  •  Zero overhead in steady state  •  Cooperative scheduling, not replacement scheduling</text>

  <!-- ═══ LEGEND ═══ -->
  <rect x="40" y="810" width="1120" height="55" rx="8" fill="#0a0a1a88" stroke="#33335566" stroke-width="1"/>
  <text x="60" y="835" fill="#888" font-size="10" font-weight="600">LEGEND:</text>
  <circle cx="140" cy="832" r="5" fill="#e94560"/><text x="150" y="836" fill="#aaa" font-size="9">Spike Detection</text>
  <circle cx="260" cy="832" r="5" fill="#60a5fa"/><text x="270" y="836" fill="#aaa" font-size="9">Dependency Graph</text>
  <circle cx="385" cy="832" r="5" fill="#a78bfa"/><text x="395" y="836" fill="#aaa" font-size="9">Gang Lifecycle</text>
  <circle cx="500" cy="832" r="5" fill="#4ade80"/><text x="510" y="836" fill="#aaa" font-size="9">Extender API</text>
  <circle cx="605" cy="832" r="5" fill="#fbbf24"/><text x="615" y="836" fill="#aaa" font-size="9">Dormancy Control</text>
  <circle cx="730" cy="832" r="5" fill="#38bdf8"/><text x="740" y="836" fill="#aaa" font-size="9">Research Metrics</text>
  <circle cx="860" cy="832" r="5" fill="#fb923c"/><text x="870" y="836" fill="#aaa" font-size="9">Metrics Scraping</text>

  <line x1="960" y1="827" x2="990" y2="827" stroke="#aaa" stroke-width="1.5"/><text x="1000" y="831" fill="#aaa" font-size="9">Data Flow</text>
  <line x1="960" y1="843" x2="990" y2="843" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4,3"/><text x="1000" y="847" fill="#aaa" font-size="9">Event / Async</text>
</svg>
