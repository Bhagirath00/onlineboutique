<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1400" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a1a3e;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrowR" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e94560"/>
    </marker>
    <marker id="arrowB" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#60a5fa"/>
    </marker>
    <marker id="arrowG" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4ade80"/>
    </marker>
    <marker id="arrowP" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a78bfa"/>
    </marker>
    <marker id="arrowY" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#fbbf24"/>
    </marker>
    <marker id="arrowW" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ccc"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1400" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="600" y="35" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">NEXUS Scheduler — Sequence Diagram</text>
  <text x="600" y="55" text-anchor="middle" fill="#888" font-size="12">From Spike Detection to Gang Dissolution (7 Stages)</text>

  <!-- ═══ PARTICIPANT HEADERS ═══ -->
  <!-- Prometheus -->
  <rect x="40" y="75" width="100" height="40" rx="6" fill="#e6522c" filter="url(#shadow)"/>
  <text x="90" y="100" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Prometheus</text>
  <line x1="90" y1="115" x2="90" y2="1340" stroke="#e6522c44" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Spike Detector -->
  <rect x="185" y="75" width="110" height="40" rx="6" fill="#e94560" filter="url(#shadow)"/>
  <text x="240" y="100" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Spike Detector</text>
  <line x1="240" y1="115" x2="240" y2="1340" stroke="#e9456044" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Dormancy Controller -->
  <rect x="340" y="75" width="120" height="40" rx="6" fill="#a16207" filter="url(#shadow)"/>
  <text x="400" y="100" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Dormancy Ctrl</text>
  <line x1="400" y1="115" x2="400" y2="1340" stroke="#a1620744" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Dependency Engine -->
  <rect x="505" y="75" width="110" height="40" rx="6" fill="#0f3460" filter="url(#shadow)"/>
  <text x="560" y="100" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Dep Engine</text>
  <line x1="560" y1="115" x2="560" y2="1340" stroke="#0f346044" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Gang Manager -->
  <rect x="660" y="75" width="110" height="40" rx="6" fill="#533483" filter="url(#shadow)"/>
  <text x="715" y="100" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Gang Manager</text>
  <line x1="715" y1="115" x2="715" y2="1340" stroke="#53348344" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- /filter + /prioritize -->
  <rect x="815" y="75" width="120" height="40" rx="6" fill="#1a6b3c" filter="url(#shadow)"/>
  <text x="875" y="100" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Extender API</text>
  <line x1="875" y1="115" x2="875" y2="1340" stroke="#1a6b3c44" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- kube-scheduler -->
  <rect x="980" y="75" width="120" height="40" rx="6" fill="#326ce5" filter="url(#shadow)"/>
  <text x="1040" y="100" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">kube-scheduler</text>
  <line x1="1040" y1="115" x2="1040" y2="1340" stroke="#326ce544" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ═══════════════════════════════════ -->
  <!-- STAGE 1: Normal Traffic (IDLE)      -->
  <!-- ═══════════════════════════════════ -->
  <rect x="15" y="130" width="1170" height="130" rx="8" fill="#1a1a2e" stroke="#33335588" stroke-width="1"/>
  <rect x="15" y="130" width="200" height="24" rx="6" fill="#333355"/>
  <text x="115" y="146" text-anchor="middle" fill="#ccc" font-size="11" font-weight="600">STAGE 1: Normal Traffic</text>
  <rect x="990" y="132" width="55" height="18" rx="4" fill="#333"/>
  <text x="1017" y="145" text-anchor="middle" fill="#4ade80" font-size="9" font-weight="700">IDLE</text>

  <!-- kube-scheduler → Extender (Filter) -->
  <line x1="1040" y1="170" x2="880" y2="170" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <text x="960" y="166" text-anchor="middle" fill="#4ade80" font-size="9">Filter request</text>

  <!-- Extender → kube-scheduler (All nodes) -->
  <line x1="875" y1="185" x2="1035" y2="185" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowG)"/>
  <text x="955" y="198" text-anchor="middle" fill="#86efac" font-size="9">All nodes OK (no opinion)</text>

  <!-- kube-scheduler → Extender (Prioritize) -->
  <line x1="1040" y1="215" x2="880" y2="215" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <text x="960" y="211" text-anchor="middle" fill="#4ade80" font-size="9">Prioritize request</text>

  <!-- Extender → kube-scheduler -->
  <line x1="875" y1="230" x2="1035" y2="230" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowG)"/>
  <text x="955" y="243" text-anchor="middle" fill="#86efac" font-size="9">Equal scores (no opinion)</text>

  <!-- Note -->
  <rect x="30" y="170" width="180" height="35" rx="4" fill="#0a0a1a" stroke="#444" stroke-width="0.5"/>
  <text x="120" y="185" text-anchor="middle" fill="#888" font-size="9">Default scheduler handles</text>
  <text x="120" y="198" text-anchor="middle" fill="#888" font-size="9">everything. Zero NEXUS overhead.</text>

  <!-- ═══════════════════════════════════ -->
  <!-- STAGE 2: Spike Detected             -->
  <!-- ═══════════════════════════════════ -->
  <rect x="15" y="275" width="1170" height="130" rx="8" fill="#2a0a0a" stroke="#e9456044" stroke-width="1.5"/>
  <rect x="15" y="275" width="200" height="24" rx="6" fill="#5a1520"/>
  <text x="115" y="291" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="600">STAGE 2: Spike Detected</text>

  <!-- Prometheus → Spike Detector -->
  <line x1="90" y1="315" x2="235" y2="315" stroke="#e94560" stroke-width="2" marker-end="url(#arrowR)"/>
  <text x="163" y="310" text-anchor="middle" fill="#e94560" font-size="9" font-weight="600">RPS = 1500 (&gt; threshold 1000)</text>

  <!-- Spike Detector self-check -->
  <rect x="245" y="325" width="120" height="15" rx="3" fill="#3a0a15"/>
  <text x="305" y="336" text-anchor="middle" fill="#fca5a5" font-size="8">SPIKE_EVENT = TRUE</text>

  <!-- Spike Detector → Dormancy -->
  <line x1="240" y1="355" x2="395" y2="355" stroke="#e94560" stroke-width="2" marker-end="url(#arrowR)"/>
  <text x="318" y="350" text-anchor="middle" fill="#e94560" font-size="9" font-weight="600">Notify: Spike detected!</text>

  <!-- Dormancy state change -->
  <rect x="405" y="360" width="130" height="15" rx="3" fill="#3a2a05"/>
  <text x="470" y="371" text-anchor="middle" fill="#fbbf24" font-size="8">STATE: IDLE → ACTIVE</text>

  <!-- Metric note -->
  <rect x="405" y="380" width="150" height="15" rx="3" fill="#0a1520"/>
  <text x="480" y="391" text-anchor="middle" fill="#38bdf8" font-size="8">📊 Record activation_latency_ms</text>

  <!-- ═══════════════════════════════════ -->
  <!-- STAGE 3: Dependency Graph Built     -->
  <!-- ═══════════════════════════════════ -->
  <rect x="15" y="420" width="1170" height="140" rx="8" fill="#0a1530" stroke="#60a5fa44" stroke-width="1.5"/>
  <rect x="15" y="420" width="250" height="24" rx="6" fill="#0f3460"/>
  <text x="140" y="436" text-anchor="middle" fill="#bfdbfe" font-size="11" font-weight="600">STAGE 3: Dependency Graph Construction</text>

  <!-- Dormancy → Dep Engine -->
  <line x1="400" y1="460" x2="555" y2="460" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowB)"/>
  <text x="478" y="455" text-anchor="middle" fill="#60a5fa" font-size="9">BuildFromAnnotations(pods)</text>

  <!-- Dep Engine → API (list pods) -->
  <line x1="560" y1="480" x2="1035" y2="480" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowB)"/>
  <text x="800" y="476" text-anchor="middle" fill="#93c5fd" font-size="9">List pods with nexus.io/depends-on annotations</text>

  <!-- API → Dep Engine (pods returned) -->
  <line x1="1035" y1="495" x2="565" y2="495" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowB)"/>
  <text x="800" y="508" text-anchor="middle" fill="#93c5fd" font-size="9">Pod list with annotations returned</text>

  <!-- Dep Engine internal -->
  <rect x="490" y="515" width="140" height="15" rx="3" fill="#0a1530"/>
  <text x="560" y="526" text-anchor="middle" fill="#bfdbfe" font-size="8">Build in-memory DAG</text>

  <!-- Dep Engine → Dormancy (DAG ready) -->
  <line x1="555" y1="540" x2="405" y2="540" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowB)"/>
  <text x="480" y="536" text-anchor="middle" fill="#93c5fd" font-size="9">DAG ready</text>

  <!-- ═══════════════════════════════════ -->
  <!-- STAGE 4: Gang Formation             -->
  <!-- ═══════════════════════════════════ -->
  <rect x="15" y="575" width="1170" height="120" rx="8" fill="#1a0a30" stroke="#a78bfa44" stroke-width="1.5"/>
  <rect x="15" y="575" width="200" height="24" rx="6" fill="#3f2566"/>
  <text x="115" y="591" text-anchor="middle" fill="#ddd6fe" font-size="11" font-weight="600">STAGE 4: Gang Formation</text>

  <!-- Dormancy → Gang Manager -->
  <line x1="400" y1="615" x2="710" y2="615" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowP)"/>
  <text x="555" y="610" text-anchor="middle" fill="#a78bfa" font-size="9" font-weight="600">FormGang(DAG, critical path)</text>

  <!-- Gang Manager internal steps -->
  <rect x="645" y="628" width="140" height="15" rx="3" fill="#1a0a30"/>
  <text x="715" y="639" text-anchor="middle" fill="#ddd6fe" font-size="8">Group critical-path services</text>
  <rect x="645" y="648" width="140" height="15" rx="3" fill="#1a0a30"/>
  <text x="715" y="659" text-anchor="middle" fill="#ddd6fe" font-size="8">Assign gang ID + labels</text>

  <!-- Gang Manager → Dormancy -->
  <line x1="710" y1="675" x2="405" y2="675" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowP)"/>
  <text x="555" y="671" text-anchor="middle" fill="#c4b5fd" font-size="9">Gang formed ✓</text>

  <!-- Metric -->
  <rect x="405" y="680" width="160" height="15" rx="3" fill="#0a1520"/>
  <text x="485" y="691" text-anchor="middle" fill="#38bdf8" font-size="8">📊 Record gang_formation_latency_ms</text>

  <!-- ═══════════════════════════════════ -->
  <!-- STAGE 5: Cooperative Scheduling     -->
  <!-- ═══════════════════════════════════ -->
  <rect x="15" y="710" width="1170" height="235" rx="8" fill="#0a200a" stroke="#4ade8044" stroke-width="1.5"/>
  <rect x="15" y="710" width="230" height="24" rx="6" fill="#1a6b3c"/>
  <text x="130" y="726" text-anchor="middle" fill="#d1fae5" font-size="11" font-weight="600">STAGE 5: Cooperative Scheduling</text>
  <rect x="990" y="712" width="65" height="18" rx="4" fill="#333"/>
  <text x="1022" y="725" text-anchor="middle" fill="#e94560" font-size="9" font-weight="700">ACTIVE</text>

  <!-- Note: Extender now ACTIVE -->
  <rect x="805" y="740" width="145" height="20" rx="4" fill="#0a200a" stroke="#4ade80" stroke-width="0.5"/>
  <text x="877" y="754" text-anchor="middle" fill="#4ade80" font-size="9" font-weight="600">Extender ACTIVE + Gang Data</text>

  <!-- kube-scheduler → /filter -->
  <line x1="1040" y1="775" x2="880" y2="775" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="960" y="771" text-anchor="middle" fill="#4ade80" font-size="9" font-weight="600">Filter (cartservice pod)</text>

  <!-- Extender internal filter -->
  <rect x="805" y="785" width="140" height="13" rx="3" fill="#0a200a"/>
  <text x="875" y="795" text-anchor="middle" fill="#86efac" font-size="8">Check gang membership ✓</text>
  <rect x="805" y="800" width="140" height="13" rx="3" fill="#0a200a"/>
  <text x="875" y="810" text-anchor="middle" fill="#86efac" font-size="8">Remove non-gang nodes</text>

  <!-- Extender → kube-scheduler (filtered) -->
  <line x1="875" y1="820" x2="1035" y2="820" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowG)"/>
  <text x="955" y="833" text-anchor="middle" fill="#86efac" font-size="9">Filtered node list</text>

  <!-- Metric -->
  <rect x="805" y="837" width="140" height="13" rx="3" fill="#0a1520"/>
  <text x="875" y="847" text-anchor="middle" fill="#38bdf8" font-size="8">📊 filter_overhead_ms</text>

  <!-- kube-scheduler → /prioritize -->
  <line x1="1040" y1="862" x2="880" y2="862" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="960" y="858" text-anchor="middle" fill="#4ade80" font-size="9" font-weight="600">Prioritize request</text>

  <!-- Extender internal prioritize -->
  <rect x="805" y="872" width="140" height="13" rx="3" fill="#0a200a"/>
  <text x="875" y="882" text-anchor="middle" fill="#86efac" font-size="8">Node A: paymentSvc → 100</text>
  <rect x="805" y="887" width="140" height="13" rx="3" fill="#0a200a"/>
  <text x="875" y="897" text-anchor="middle" fill="#86efac" font-size="8">Node B: empty → 0</text>

  <!-- Extender → kube-scheduler (scores) -->
  <line x1="875" y1="907" x2="1035" y2="907" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowG)"/>
  <text x="955" y="920" text-anchor="middle" fill="#86efac" font-size="9">Priority scores</text>

  <!-- Metric -->
  <rect x="805" y="924" width="140" height="13" rx="3" fill="#0a1520"/>
  <text x="875" y="934" text-anchor="middle" fill="#38bdf8" font-size="8">📊 prioritize_overhead_ms</text>

  <!-- Big note: Default scheduler binds -->
  <rect x="30" y="860" width="200" height="55" rx="6" fill="#0a0a1a" stroke="#4ade80" stroke-width="1"/>
  <text x="130" y="878" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="700">⚡ KEY POINT</text>
  <text x="130" y="895" text-anchor="middle" fill="#d1fae5" font-size="9">kube-scheduler makes the</text>
  <text x="130" y="908" text-anchor="middle" fill="#d1fae5" font-size="9">final bind decision, NOT NEXUS</text>

  <!-- ═══════════════════════════════════ -->
  <!-- STAGE 6: Spike Window Ends          -->
  <!-- ═══════════════════════════════════ -->
  <rect x="15" y="960" width="1170" height="110" rx="8" fill="#1a1a0a" stroke="#fbbf2444" stroke-width="1.5"/>
  <rect x="15" y="960" width="220" height="24" rx="6" fill="#a16207"/>
  <text x="125" y="976" text-anchor="middle" fill="#fef3c7" font-size="11" font-weight="600">STAGE 6: Spike Window Ends</text>

  <!-- Prometheus → Spike Detector (low traffic) -->
  <line x1="90" y1="1000" x2="235" y2="1000" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowY)"/>
  <text x="163" y="996" text-anchor="middle" fill="#fbbf24" font-size="9">RPS = 400 (below threshold)</text>

  <!-- Spike Detector → Dormancy -->
  <line x1="240" y1="1020" x2="395" y2="1020" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowY)"/>
  <text x="318" y="1016" text-anchor="middle" fill="#fde68a" font-size="9">No spike detected</text>

  <!-- Dormancy internal -->
  <rect x="338" y="1032" width="120" height="13" rx="3" fill="#1a1a0a"/>
  <text x="398" y="1042" text-anchor="middle" fill="#fde68a" font-size="8">Cooldown timer: 30s</text>
  <rect x="338" y="1048" width="120" height="13" rx="3" fill="#1a1a0a"/>
  <text x="398" y="1058" text-anchor="middle" fill="#fde68a" font-size="8">Pending pods = 0 ✓</text>

  <!-- ═══════════════════════════════════ -->
  <!-- STAGE 7: Gang Dissolution           -->
  <!-- ═══════════════════════════════════ -->
  <rect x="15" y="1085" width="1170" height="225" rx="8" fill="#1a1a2e" stroke="#a78bfa44" stroke-width="1.5"/>
  <rect x="15" y="1085" width="200" height="24" rx="6" fill="#3f2566"/>
  <text x="115" y="1101" text-anchor="middle" fill="#ddd6fe" font-size="11" font-weight="600">STAGE 7: Gang Dissolution</text>

  <!-- Dormancy → Gang Manager (dissolve) -->
  <line x1="400" y1="1125" x2="710" y2="1125" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowP)"/>
  <text x="555" y="1121" text-anchor="middle" fill="#a78bfa" font-size="9" font-weight="600">DissolveGang()</text>

  <!-- Gang Manager internal -->
  <rect x="645" y="1135" width="140" height="13" rx="3" fill="#1a0a30"/>
  <text x="715" y="1145" text-anchor="middle" fill="#ddd6fe" font-size="8">Remove gang labels</text>
  <rect x="645" y="1150" width="140" height="13" rx="3" fill="#1a0a30"/>
  <text x="715" y="1160" text-anchor="middle" fill="#ddd6fe" font-size="8">Clear in-memory gang data</text>

  <!-- Gang Manager → Dormancy -->
  <line x1="710" y1="1175" x2="405" y2="1175" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowP)"/>
  <text x="555" y="1171" text-anchor="middle" fill="#c4b5fd" font-size="9">Gang dissolved ✓</text>

  <!-- Dormancy → Dep Engine (clear) -->
  <line x1="400" y1="1200" x2="555" y2="1200" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowB)"/>
  <text x="478" y="1196" text-anchor="middle" fill="#60a5fa" font-size="9">ClearGraph()</text>

  <!-- Dep Engine internal -->
  <rect x="490" y="1210" width="140" height="13" rx="3" fill="#0a1530"/>
  <text x="560" y="1220" text-anchor="middle" fill="#bfdbfe" font-size="8">Free in-memory DAG</text>

  <!-- Dep Engine → Dormancy -->
  <line x1="555" y1="1235" x2="405" y2="1235" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowB)"/>
  <text x="480" y="1231" text-anchor="middle" fill="#93c5fd" font-size="9">Graph cleared ✓</text>

  <!-- Dormancy state change back -->
  <rect x="338" y="1248" width="130" height="15" rx="3" fill="#3a2a05"/>
  <text x="403" y="1259" text-anchor="middle" fill="#fbbf24" font-size="8" font-weight="600">STATE: ACTIVE → IDLE</text>

  <!-- Back to no-opinion -->
  <line x1="1040" y1="1280" x2="880" y2="1280" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <text x="960" y="1276" text-anchor="middle" fill="#4ade80" font-size="9">Filter request (new pod)</text>
  <line x1="875" y1="1295" x2="1035" y2="1295" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowG)"/>
  <text x="955" y="1291" text-anchor="middle" fill="#86efac" font-size="9">All nodes OK (no opinion again)</text>

  <!-- Final IDLE badge -->
  <rect x="990" y="1088" width="55" height="18" rx="4" fill="#333"/>
  <text x="1017" y="1101" text-anchor="middle" fill="#4ade80" font-size="9" font-weight="700">IDLE</text>

  <!-- ═══ FOOTER SUMMARY ═══ -->
  <rect x="15" y="1325" width="1170" height="55" rx="8" fill="#0a0a1a" stroke="#53348866" stroke-width="1"/>
  <text x="600" y="1348" text-anchor="middle" fill="#e94560" font-size="12" font-weight="700">Research Paper Proof Points</text>
  <text x="600" y="1366" text-anchor="middle" fill="#999" font-size="10">Event-Driven ✓  •  Cooperative ✓  •  Temporary Gangs ✓  •  No Migration ✓  •  Low Overhead ✓  •  Kubernetes-Native ✓</text>
</svg>
