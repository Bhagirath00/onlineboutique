apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust
  namespace: nexus-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: locust
  template:
    metadata:
      labels:
        app: locust
    spec:
      containers:
      - name: locust
        image: locustio/locust:latest
        ports:
        - containerPort: 8089
        env:
        - name: LOCUST_HOST
          value: "http://frontend.default.svc.cluster.local"
        - name: LOCUST_LOCUSTFILE
          value: "/mnt/locust/locustfile.py"
        volumeMounts:
        - name: locust-scripts
          mountPath: /mnt/locust
      volumes:
      - name: locust-scripts
        configMap:
          name: locust-scripts
---
apiVersion: v1
kind: Service
metadata:
  name: locust
  namespace: nexus-system
spec:
  type: LoadBalancer
  ports:
  - port: 8089
    targetPort: 8089
  selector:
    app: locust
